# Render Blueprint for Fast Temp Mail — free $0 stack (no credit card).
#
# Creates ONE free web service (Docker runtime, 512 MB RAM). The database is
# NOT on Render: Render's free Postgres expires, so DATABASE_URL must point
# at your free Supabase PostgreSQL project (see README, Option A).
#
# Deploy: Render Dashboard → New → Blueprint → connect the GitHub repo
# containing this folder → fill the prompted env vars → Apply.
services:
  - type: web
    name: fast-temp-mail
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Supabase connection string (pooler URL, port 6543, recommended):
      # postgresql://postgres:YOUR-PASSWORD@db.YOUR-REF.supabase.co:6543/postgres?pgbouncer=true&sslmode=require
      - key: DATABASE_URL
        sync: false
      # Random session pepper, generated by Render on first deploy.
      - key: SESSION_SECRET
        generateValue: true
      # Admin account created automatically on first boot.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Display domain for generated temp addresses (change when you own one).
      - key: MAIL_DOMAIN
        value: fasttempmail.site
      # Demo helpers ON by default: shows the "simulate incoming mail" button
      # and reveals OTP codes on screen when email delivery is not configured.
      # Set to "false" for a production deployment.
      - key: DEMO_MODE
        value: "true"
      # Optional — Google OAuth ("Continue with Google").
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # e.g. https://fasttempmail.onrender.com/oauth/callback
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Optional — adds the Gmail read-only scope for the future Pro
      # "Gmail-connected mailbox" feature. Leave unset otherwise.
      # - key: GOOGLE_GMAIL_SCOPE
      #   value: "true"
      # Optional — Resend (OTP + password-reset emails).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: NODE_ENV
        value: production
